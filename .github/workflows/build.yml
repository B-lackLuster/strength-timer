name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Test, lint and build signed APK
        env:
          SIGNING_STORE: ${{ runner.temp }}/release.jks
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease assembleDebug assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: strength-timer-apk
          path: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports
  device-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: emulator-test-apks
          path: apks
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: false
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb install apks/debug/app-debug.apk
            adb install apks/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant com.strengthtimer.app android.permission.POST_NOTIFICATIONS
            # Cold boot can leave System UI's startup ANR above every app.
            # Restart only these emulator components before testing the application.
            adb root
            adb wait-for-device
            adb shell settings put system screen_off_timeout 2147483647
            sleep 20
            adb shell pkill -f '^com\.android\.systemui$' || true
            adb shell am force-stop com.android.launcher3
            sleep 10
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell am start -W -n com.strengthtimer.app/.MainActivity
            app_focus_ready=false
            for attempt in $(seq 1 15); do
              adb shell dumpsys window > preflight-window.txt
              if grep -q 'mCurrentFocus=.*com.strengthtimer.app/.MainActivity' preflight-window.txt; then
                app_focus_ready=true
                break
              fi
              sleep 2
            done
            if [ "$app_focus_ready" != true ]; then
              adb logcat -d > device-logcat.txt
              cat preflight-window.txt
              exit 1
            fi
            adb shell am instrument -w com.strengthtimer.app.test/androidx.test.runner.AndroidJUnitRunner | tee instrument-results.txt
            adb logcat -d > device-logcat.txt
            adb shell dumpsys window > device-window.txt
            adb shell screencap -p /sdcard/test-screen.png
            adb pull /sdcard/test-screen.png test-screen.png
            adb pull /sdcard/Android/data/com.strengthtimer.app/files/screenshots screenshots
            grep -q 'OK (14 tests)' instrument-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: |
            instrument-results.txt
            device-logcat.txt
            device-window.txt
            preflight-window.txt
            test-screen.png
            screenshots
