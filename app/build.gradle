plugins { id 'com.android.application' }
android {
    namespace 'com.strengthtimer.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.strengthtimer.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            storeFile file(System.getenv('SIGNING_STORE') ?: '../../release.jks')
            storePassword System.getenv('SIGNING_PASSWORD')
            keyAlias 'strength-timer'
            keyPassword System.getenv('SIGNING_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
